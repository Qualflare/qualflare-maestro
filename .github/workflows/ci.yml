name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Lint, vet, unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would rewrite:"; echo "$unformatted"
            exit 1
          fi
      - run: go vet ./... && go vet -tags integration ./test/integration/
      - run: GOOS=windows go vet ./...
      - run: go test -race ./...

      # `go install` broke at v0.1.0-rc.1: the module zip format allows only
      # alphanumerics plus !#$%&()+,-.=@[]^_{}~ and space in a path element, and
      # Maestro names a failure screenshot with an emoji. Nothing in the gate
      # builds a module zip, so only the rc caught it. This does, in one grep.
      - name: Paths are valid inside a Go module zip
        run: |
          # A directory with its own go.mod is pruned from this module, so its
          # paths are exempt -- that is exactly how test/captures/ keeps the
          # emoji-named screenshots while `go install` still resolves.
          # core.quotePath=false keeps a non-ASCII path readable and, more to the
          # point, unquoted -- otherwise the prune filter below never matches it.
          paths=$(git -c core.quotePath=false ls-files)
          for dir in $(git ls-files '*/go.mod' | xargs -r -n1 dirname); do
            paths=$(printf '%s\n' "$paths" | grep -v "^$dir/" || true)
          done
          bad=$(printf '%s\n' "$paths" | LC_ALL=C grep -E '[^A-Za-z0-9!#$%&()+,./=@[\]^_{}~ -]' || true)
          if [ -n "$bad" ]; then
            echo "::error::these tracked paths cannot go in a module zip (golang.org/x/mod/module fileNameOK):"
            echo "$bad"
            echo "Move them under a directory with its own go.mod, as test/captures/ does."
            exit 1
          fi

  floor:
    name: Go 1.21 (module floor)
    needs: unit
    runs-on: ubuntu-latest
    env:
      # Without this a newer toolchain is downloaded silently and the floor is
      # never actually tested.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.21'
      - run: go build ./... && go test ./...

  no-deps:
    name: Zero external dependencies
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: |
          modules=$(go list -m all | grep -v '^github.com/Qualflare/qualflare-maestro$' || true)
          if [ -n "$modules" ]; then
            echo "::error::unexpected module dependencies:"; echo "$modules"; exit 1
          fi

  maestro:
    name: Real Maestro ${{ matrix.maestro }} on an iOS simulator
    needs: unit
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # 2.6.1 writes the flat debug layout, latest the per-flow bundle. Both
        # must keep working; latest is also what catches Maestro's next change.
        maestro: ['2.6.1', 'latest']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Maestro
        run: |
          if [ "${{ matrix.maestro }}" != "latest" ]; then export MAESTRO_VERSION="${{ matrix.maestro }}"; fi
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - run: maestro --version
      # Before any simulator boots: these cases need no device.
      - name: Invalid YAML and no device
        run: go test -tags integration ./test/integration/ -run 'TestInvalidYAML|TestNoDevice' -v -count=1 -timeout 30m
      - name: Boot an iPhone simulator
        run: |
          udid=$(python3 test/integration/pick-simulator.py)
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
      - name: Flows against the Settings app
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'
        run: go test -tags integration ./test/integration/ -run TestFlows -v -count=1 -timeout 50m
